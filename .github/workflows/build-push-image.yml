name: Build, Test, and Push Docker Image

on:
  push:
    branches: [submission]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cross-compile api
        run: RINHA_SKIP_C_AVX2=1 cargo zigbuild --target x86_64-unknown-linux-gnu --release --bin api -p rinha-api

      - name: Cross-compile lb
        run: RINHA_SKIP_C_AVX2=1 cargo zigbuild --target x86_64-unknown-linux-gnu --release --bin lb -p rinha-lb

      - name: Verify binaries
        run: |
          ls -la target/x86_64-unknown-linux-gnu/release/
          file target/x86_64-unknown-linux-gnu/release/api
          file target/x86_64-unknown-linux-gnu/release/lb

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/sergiotec/rinha-2026:latest
            ghcr.io/sergiotec/rinha-2026:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/sergiotec/rinha-2026:latest

      - name: Test local (valida antes do push)
        run: |
          echo "=== Subindo stack com imagem local ==="
          docker compose down --remove-orphans 2>&1 || true
          docker compose up -d 2>&1

          echo ""
          echo "=== Aguardando containers iniciarem (5s) ==="
          sleep 5

          echo ""
          echo "=== Health check (até 60s) ==="
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://localhost:9999/ready 2>&1)
            if [ "$CODE" = "200" ]; then
              echo "Health check PASSOU na tentativa $i (status $CODE)"
              break
            fi
            echo "Tentativa $i falhou (status: $CODE), aguardando 3s..."
            sleep 3
          done
          if [ "$CODE" != "200" ]; then
            echo "FALHOU: /ready não retornou 200 após 60s (último status: $CODE)"
            docker compose logs
            exit 1
          fi

          echo ""
          echo "=== Teste de detecção com payloads REAIS do REGRAS_DE_DETECCAO.md ==="
          echo "Estes são os 2 exemplos garantidos como legit e fraud no doc oficial."
          echo ""

          # Caso 1: LEGÍTIMO (tx-1329056812, do REGRAS_DE_DETECCAO.md)
          # Esperado: fraud_score=0.0, approved=true
          RESP=$(curl -s -X POST http://localhost:9999/fraud-score \
            -H 'Content-Type: application/json' \
            -d '{
              "id": "tx-1329056812",
              "transaction": {"amount": 41.12, "installments": 2, "requested_at": "2026-03-11T18:45:53Z"},
              "customer": {"avg_amount": 82.24, "tx_count_24h": 3, "known_merchants": ["MERC-003", "MERC-016"]},
              "merchant": {"id": "MERC-016", "mcc": "5411", "avg_amount": 60.25},
              "terminal": {"is_online": false, "card_present": true, "km_from_home": 29.2331036248},
              "last_transaction": null
            }')
          echo "LEGÍTIMO esperado: $RESP"
          if echo "$RESP" | grep -q '"approved":true'; then
            echo "✓ Legit aprovado (approved:true) — esperado"
          else
            echo "::error::Legit NÃO aprovado! Possível FN. Resposta: $RESP"
            docker compose logs
            exit 1
          fi

          # Caso 2: FRAUDE (tx-3330991687, do REGRAS_DE_DETECCAO.md)
          # Esperado: fraud_score=1.0, approved=false
          RESP2=$(curl -s -X POST http://localhost:9999/fraud-score \
            -H 'Content-Type: application/json' \
            -d '{
              "id": "tx-3330991687",
              "transaction": {"amount": 9505.97, "installments": 10, "requested_at": "2026-03-14T05:15:12Z"},
              "customer": {"avg_amount": 81.28, "tx_count_24h": 20, "known_merchants": ["MERC-008", "MERC-007", "MERC-005"]},
              "merchant": {"id": "MERC-068", "mcc": "7802", "avg_amount": 54.86},
              "terminal": {"is_online": false, "card_present": true, "km_from_home": 952.2745933273},
              "last_transaction": null
            }')
          echo "FRAUDE esperado: $RESP2"
          if echo "$RESP2" | grep -q '"approved":false'; then
            echo "✓ Fraude detectada (approved:false) — esperado"
          else
            echo "::error::Fraude NÃO detectada! Possível FP grave. Resposta: $RESP2"
            docker compose logs
            exit 1
          fi

          # Caso 3: mais um legit (tx-3943816664) e um borderline
          # Esse do example-payloads.json, mas vamos validar apenas que responde
          echo ""
          echo "=== Validação de resposta em 10 payloads aleatórios ==="
          for id in tx-1788243118 tx-1841834722 tx-2870794086 tx-3795737979 tx-2735832589; do
            RESP=$(curl -s -X POST http://localhost:9999/fraud-score \
              -H 'Content-Type: application/json' \
              -d "{\"id\":\"$id\",\"transaction\":{\"amount\":100,\"installments\":1,\"requested_at\":\"2026-01-01T12:00:00Z\"},\"customer\":{\"avg_amount\":100,\"tx_count_24h\":3,\"known_merchants\":[\"MERC-016\"]},\"merchant\":{\"id\":\"MERC-016\",\"mcc\":\"5411\",\"avg_amount\":60},\"terminal\":{\"is_online\":false,\"card_present\":true,\"km_from_home\":10},\"last_transaction\":null}" 2>&1)
            if ! echo "$RESP" | grep -q '"approved"'; then
              echo "::error::Resposta inválida para $id: $RESP"
              docker compose logs
              exit 1
            fi
          done
          echo "✓ 5 payloads aleatórios responderam corretamente"

          echo ""
          echo "=== Teste de carga (200 requests) ==="
          HTTP_500=0
          > /tmp/codes.txt
          for batch in $(seq 1 20); do
            for i in $(seq 1 10); do
              (
                CODE=$(curl -s -X POST http://localhost:9999/fraud-score \
                  -H 'Content-Type: application/json' \
                  -d '{"id":"t","transaction":{"amount":100,"installments":1,"requested_at":"2026-01-01T12:00:00Z"},"customer":{"avg_amount":100,"tx_count_24h":10,"known_merchants":[]},"merchant":{"id":"m","mcc":"5411","avg_amount":100},"terminal":{"is_online":false,"card_present":true,"km_from_home":5},"last_transaction":{"timestamp":"2025-12-31T10:00:00Z","km_from_current":5}}' \
                  -o /dev/null -w "%{http_code}" 2>&1)
                echo "$CODE" >> /tmp/codes.txt
              ) &
            done
            wait
          done
          TOTAL=$(wc -l < /tmp/codes.txt)
          HTTP_500=$(grep -c "^5" /tmp/codes.txt 2>/dev/null | head -1)
          HTTP_500=${HTTP_500:-0}
          echo "Total: $TOTAL, HTTP 5xx: $HTTP_500"
          if [ "$HTTP_500" -gt 10 ]; then
            echo "FALHOU: $HTTP_500 erros 5xx em $TOTAL (5%+)"
            docker compose logs
            exit 1
          fi

          echo ""
          echo "=== Medir p99 (200 sequenciais) ==="
          for i in $(seq 1 200); do
            curl -s -X POST http://localhost:9999/fraud-score \
              -H 'Content-Type: application/json' \
              -d '{"id":"t","transaction":{"amount":100,"installments":1,"requested_at":"2026-01-01T12:00:00Z"},"customer":{"avg_amount":100,"tx_count_24h":10,"known_merchants":[]},"merchant":{"id":"m","mcc":"5411","avg_amount":100},"terminal":{"is_online":false,"card_present":true,"km_from_home":5},"last_transaction":{"timestamp":"2025-12-31T10:00:00Z","km_from_current":5}}' \
              -o /dev/null -w "%{time_total}\n" 2>&1
          done | sort -n > /tmp/latencies.txt
          P50_MS=$(awk -v p=$(awk 'NR==100' /tmp/latencies.txt) 'BEGIN{print int(p*1000)}')
          P95_MS=$(awk -v p=$(awk 'NR==190' /tmp/latencies.txt) 'BEGIN{print int(p*1000)}')
          P99_MS=$(awk -v p=$(awk 'NR==198' /tmp/latencies.txt) 'BEGIN{print int(p*1000)}')
          echo "Latências (ms): p50=$P50_MS  p95=$P95_MS  p99=$P99_MS"
          if [ "$P99_MS" -gt 50 ]; then
            echo "::warning::p99 = ${P99_MS}ms (acima de 50ms)"
          fi

          echo ""
          echo "=== Cleanup ==="
          docker compose down --remove-orphans 2>&1 || true
          echo "Testes locais passaram — prosseguindo para push"

      - name: Push Docker image to GHCR
        if: success()
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/sergiotec/rinha-2026:latest
          docker push ghcr.io/sergiotec/rinha-2026:${{ github.sha }}

      - name: Verify push
        if: success()
        run: |
          echo "Verificando que a imagem foi pushada:"
          docker manifest inspect ghcr.io/sergiotec/rinha-2026:latest | head -5
          echo ""
          echo "Digest do push: ${{ github.sha }}"
