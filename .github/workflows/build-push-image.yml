name: Build, Test, and Push Docker Image

on:
  push:
    branches: [submission]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cross-compile api
        run: RINHA_SKIP_C_AVX2=1 cargo zigbuild --target x86_64-unknown-linux-gnu --release --bin api -p rinha-api

      - name: Cross-compile lb
        run: RINHA_SKIP_C_AVX2=1 cargo zigbuild --target x86_64-unknown-linux-gnu --release --bin lb -p rinha-lb

      - name: Verify binaries
        run: |
          ls -la target/x86_64-unknown-linux-gnu/release/
          file target/x86_64-unknown-linux-gnu/release/api
          file target/x86_64-unknown-linux-gnu/release/lb

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/sergiotec/rinha-2026:latest
            ghcr.io/sergiotec/rinha-2026:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/sergiotec/rinha-2026:latest

      - name: Test local (valida antes do push)
        run: |
          # Desabilitar strict mode para permitir timeouts e erros esperados
          set +e
          set +o pipefail

          echo "=== Instalando stress para simular hardware mais lento ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq stress 2>&1 | tail -5
          
          echo "=== Iniciando stress de CPU (simula Mac Mini 2014 mais lento) ==="
          # Mac Mini 2014: 2.6GHz dual-core, nosso runner é muito mais rápido
          # Vamos ocupar 2-3 cores para reduzir CPU disponível
          stress --cpu 3 --io 2 --vm 1 --vm-bytes 128M --timeout 600s &
          STRESS_PID=$!
          echo "Stress rodando em background (PID: $STRESS_PID)"
          sleep 2
          echo "Load atual: $(cat /proc/loadavg | awk '{print $1}')"

          echo "=== Subindo stack com imagem local ==="
          docker compose down --remove-orphans 2>&1 || true
          docker compose up -d 2>&1

          echo ""
          echo "=== Verificando limites de recursos ==="
          sleep 2
          docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}" 2>/dev/null || echo "Containers ainda iniciando..."

          echo ""
          echo "=== Aguardando containers iniciarem (5s) ==="
          sleep 5

          echo ""
          echo "=== Health check (até 90s) ==="
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null --max-time 2 http://localhost:9999/ready; then
              echo "Health check PASSOU na tentativa $i"
              break
            fi
            echo "Tentativa $i falhou, aguardando 3s..."
            sleep 3
          done

          echo ""
          echo "=== Teste de detecção com payloads REAIS do REGRAS_DE_DETECCAO.md ==="
          echo "Estes são os 2 exemplos garantidos como legit e fraud no doc oficial."
          echo ""

          # Caso 1: LEGÍTIMO (tx-1329056812, do REGRAS_DE_DETECCAO.md)
          # Esperado: fraud_score=0.0, approved=true
          RESP=$(curl -s -X POST http://localhost:9999/fraud-score \
            -H 'Content-Type: application/json' \
            -d '{
              "id": "tx-1329056812",
              "transaction": {"amount": 41.12, "installments": 2, "requested_at": "2026-03-11T18:45:53Z"},
              "customer": {"avg_amount": 82.24, "tx_count_24h": 3, "known_merchants": ["MERC-003", "MERC-016"]},
              "merchant": {"id": "MERC-016", "mcc": "5411", "avg_amount": 60.25},
              "terminal": {"is_online": false, "card_present": true, "km_from_home": 29.2331036248},
              "last_transaction": null
            }')
          echo "LEGÍTIMO esperado: $RESP"
          if echo "$RESP" | grep -q '"approved":true'; then
            echo "✓ Legit aprovado (approved:true) — esperado"
          else
            echo "::error::Legit NÃO aprovado! Possível FN. Resposta: $RESP"
            docker compose logs
            exit 1
          fi

          # Caso 2: FRAUDE (tx-3330991687, do REGRAS_DE_DETECCAO.md)
          # Esperado: fraud_score=1.0, approved=false
          RESP2=$(curl -s -X POST http://localhost:9999/fraud-score \
            -H 'Content-Type: application/json' \
            -d '{
              "id": "tx-3330991687",
              "transaction": {"amount": 9505.97, "installments": 10, "requested_at": "2026-03-14T05:15:12Z"},
              "customer": {"avg_amount": 81.28, "tx_count_24h": 20, "known_merchants": ["MERC-008", "MERC-007", "MERC-005"]},
              "merchant": {"id": "MERC-068", "mcc": "7802", "avg_amount": 54.86},
              "terminal": {"is_online": false, "card_present": true, "km_from_home": 952.2745933273},
              "last_transaction": null
            }')
          echo "FRAUDE esperado: $RESP2"
          if echo "$RESP2" | grep -q '"approved":false'; then
            echo "✓ Fraude detectada (approved:false) — esperado"
          else
            echo "::error::Fraude NÃO detectada! Possível FP grave. Resposta: $RESP2"
            docker compose logs
            exit 1
          fi

          # Caso 3: mais um legit (tx-3943816664) e um borderline
          # Esse do example-payloads.json, mas vamos validar apenas que responde
          echo ""
          echo "=== Validação de resposta em 20 payloads variados ==="
          echo "Testando diferentes perfis para evitar overfitting nos 2 ground-truth."
          # Payloads variados: diferentes montantes, MCCs, comportamentos
          PAYLOADS='[
            {"id":"tx-001","amount":5.00,"installments":1,"mcc":"5411","avg_amount":50,"tx_count_24h":1,"km_from_home":1},
            {"id":"tx-002","amount":5000.00,"installments":1,"mcc":"6011","avg_amount":50,"tx_count_24h":1,"km_from_home":800},
            {"id":"tx-003","amount":150.00,"installments":3,"mcc":"5411","avg_amount":120,"tx_count_24h":5,"km_from_home":15},
            {"id":"tx-004","amount":9999.99,"installments":12,"mcc":"7802","avg_amount":100,"tx_count_24h":25,"km_from_home":999},
            {"id":"tx-005","amount":25.00,"installments":1,"mcc":"5912","avg_amount":30,"tx_count_24h":2,"km_from_home":5},
            {"id":"tx-006","amount":300.00,"installments":1,"mcc":"5541","avg_amount":250,"tx_count_24h":8,"km_from_home":50},
            {"id":"tx-007","amount":50.00,"installments":1,"mcc":"5411","avg_amount":45,"tx_count_24h":1,"km_from_home":2},
            {"id":"tx-008","amount":4500.00,"installments":6,"mcc":"6011","avg_amount":200,"tx_count_24h":15,"km_from_home":500},
            {"id":"tx-009","amount":80.00,"installments":2,"mcc":"5812","avg_amount":70,"tx_count_24h":4,"km_from_home":12},
            {"id":"tx-010","amount":7500.00,"installments":10,"mcc":"7802","avg_amount":150,"tx_count_24h":20,"km_from_home":750}
          ]'
          
          FAIL_COUNT=0
          for row in $(echo "$PAYLOADS" | python3 -c "import sys,json; [print(json.dumps(r)) for r in json.load(sys.stdin)]"); do
            AMOUNT=$(echo "$row" | python3 -c "import sys,json; print(json.load(sys.stdin)['amount'])")
            INSTALLMENTS=$(echo "$row" | python3 -c "import sys,json; print(json.load(sys.stdin)['installments'])")
            MCC=$(echo "$row" | python3 -c "import sys,json; print(json.load(sys.stdin)['mcc'])")
            AVG_AMT=$(echo "$row" | python3 -c "import sys,json; print(json.load(sys.stdin)['avg_amount'])")
            TX_COUNT=$(echo "$row" | python3 -c "import sys,json; print(json.load(sys.stdin)['tx_count_24h'])")
            KM=$(echo "$row" | python3 -c "import sys,json; print(json.load(sys.stdin)['km_from_home'])")
            
            RESP=$(curl -s -m 5 -X POST http://localhost:9999/fraud-score \
              -H 'Content-Type: application/json' \
              -d "{\"id\":\"$id\",\"transaction\":{\"amount\":$AMOUNT,\"installments\":$INSTALLMENTS,\"requested_at\":\"2026-01-01T12:00:00Z\"},\"customer\":{\"avg_amount\":$AVG_AMT,\"tx_count_24h\":$TX_COUNT,\"known_merchants\":[\"MERC-001\"]},\"merchant\":{\"id\":\"MERC-001\",\"mcc\":\"$MCC\",\"avg_amount\":$AVG_AMT},\"terminal\":{\"is_online\":false,\"card_present\":true,\"km_from_home\":$KM},\"last_transaction\":null}" 2>&1)
            if ! echo "$RESP" | grep -q '"approved"'; then
              echo "::error::Resposta inválida para payload variado: $RESP"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          
          if [ "$FAIL_COUNT" -gt 2 ]; then
            echo "::error::$FAIL_COUNT payloads variados falharam (>10%) — possível regressão!"
            docker compose logs
            exit 1
          fi
          echo "✓ 10 payloads variados responderam corretamente ($FAIL_COUNT falhas toleradas)"

          echo ""
          echo "=== Teste de carga (500 requests) com timeout 2s ==="
          HTTP_500=0
          HTTP_4XX=0
          HTTP_TIMEOUT=0
          > /tmp/codes.txt
          for batch in $(seq 1 25); do
            for i in $(seq 1 20); do
              (
                # -m 2: timeout de 2s. Se API demorar mais, curl retorna exit code 28.
                # Isso detecta regressões de performance (p99 > 2s causaria corte no bot).
                CODE=$(curl -s -m 2.001 -X POST http://localhost:9999/fraud-score \
                  -H 'Content-Type: application/json' \
                  -d '{"id":"t","transaction":{"amount":100,"installments":1,"requested_at":"2026-01-01T12:00:00Z"},"customer":{"avg_amount":100,"tx_count_24h":10,"known_merchants":[]},"merchant":{"id":"m","mcc":"5411","avg_amount":100},"terminal":{"is_online":false,"card_present":true,"km_from_home":5},"last_transaction":{"timestamp":"2025-12-31T10:00:00Z","km_from_current":5}}' \
                  -o /dev/null -w "%{http_code}" 2>&1)
                RC=$?
                if [ $RC -eq 28 ]; then
                  echo "TIMEOUT" >> /tmp/codes.txt
                else
                  echo "$CODE" >> /tmp/codes.txt
                fi
              ) &
            done
            wait
          done
          TOTAL=$(wc -l < /tmp/codes.txt)
          HTTP_500=$(grep -c "^5" /tmp/codes.txt 2>/dev/null | head -1)
          HTTP_500=${HTTP_500:-0}
          HTTP_4XX=$(grep -c "^4" /tmp/codes.txt 2>/dev/null | head -1)
          HTTP_4XX=${HTTP_4XX:-0}
          HTTP_TIMEOUT=$(grep -c "TIMEOUT" /tmp/codes.txt 2>/dev/null | head -1)
          HTTP_TIMEOUT=${HTTP_TIMEOUT:-0}
          echo "Total: $TOTAL, HTTP 5xx: $HTTP_500, HTTP 4xx: $HTTP_4XX, Timeouts(>2s): $HTTP_TIMEOUT"
          if [ "$HTTP_500" -gt 50 ]; then
            echo "FALHOU: $HTTP_500 erros 5xx em $TOTAL (5%+)"
            docker compose logs
            exit 1
          fi
          if [ "$HTTP_TIMEOUT" -gt 25 ]; then
            echo "::error::$HTTP_TIMEOUT timeouts (>2s) em $TOTAL (2.5%+) — API muito lenta!"
            docker compose logs
            exit 1
          fi
          if [ "$HTTP_4XX" -gt 0 ]; then
            echo "::warning::$HTTP_4XX erros 4xx — API começou a rejeitar requests (regressão!)"
          fi

          echo ""
          echo "=== Medir p99 (500 sequenciais) com timeout 2s ==="
          > /tmp/latencies.txt
          for i in $(seq 1 1000); do
            # -m 2: timeout. Se > 2s, registra como -1 (timeout) e não conta pro p99.
            T=$(curl -s -m 2.001 -X POST http://localhost:9999/fraud-score \
              -H 'Content-Type: application/json' \
              -d '{"id":"t","transaction":{"amount":100,"installments":1,"requested_at":"2026-01-01T12:00:00Z"},"customer":{"avg_amount":100,"tx_count_24h":10,"known_merchants":[]},"merchant":{"id":"m","mcc":"5411","avg_amount":100},"terminal":{"is_online":false,"card_present":true,"km_from_home":5},"last_transaction":{"timestamp":"2025-12-31T10:00:00Z","km_from_current":5}}' \
              -o /dev/null -w "%{time_total}" 2>&1) || true
            RC=$?
            if [ $RC -eq 28 ]; then
              echo "-1" >> /tmp/latencies.txt
            elif [ -n "$T" ]; then
              echo "$T" >> /tmp/latencies.txt
            else
              echo "-1" >> /tmp/latencies.txt
            fi
          done
          # Remove timeouts
          grep -v "^-1$" /tmp/latencies.txt | sort -n > /tmp/latencies_clean.txt || true
          TIME_OUTS=$(grep -c "^-1$" /tmp/latencies.txt)
          VALID=$(wc -l < /tmp/latencies_clean.txt)
          # Se não houver dados válidos, não calcular percentis
          if [ "$VALID" -eq 0 ]; then
            P50_MS=0; P95_MS=0; P99_MS=0
          else
            P50_IDX=$((VALID / 2))
            [ "$P50_IDX" -lt 1 ] && P50_IDX=1
            P95_IDX=$((VALID * 95 / 100))
            [ "$P95_IDX" -lt 1 ] && P95_IDX=1
            P99_IDX=$((VALID * 99 / 100))
            [ "$P99_IDX" -lt 1 ] && P99_IDX=1
            P50_VAL=$(awk "NR==$P50_IDX" /tmp/latencies_clean.txt || echo "0")
            P95_VAL=$(awk "NR==$P95_IDX" /tmp/latencies_clean.txt || echo "0")
            P99_VAL=$(awk "NR==$P99_IDX" /tmp/latencies_clean.txt || echo "0")
            P50_MS=$(awk -v p="$P50_VAL" 'BEGIN{print int(p*1000)}')
            P95_MS=$(awk -v p="$P95_VAL" 'BEGIN{print int(p*1000)}')
            P99_MS=$(awk -v p="$P99_VAL" 'BEGIN{print int(p*1000)}')
          fi
          echo "Latências (ms): p50=$P50_MS  p95=$P95_MS  p99=$P99_MS  [valid=$VALID timeouts=$TIME_OUTS]"
          if [ "$VALID" -gt 0 ] && [ "$P99_MS" -gt 5 ]; then
            echo "::warning::p99 = ${P99_MS}ms (acima de 5ms, regressão de performance!)"
          fi
          if [ "$VALID" -gt 0 ] && [ "$P99_MS" -gt 10 ]; then
            echo "::error::p99 = ${P99_MS}ms (acima de 10ms, perde pontos no bot!)"
            exit 1
          fi
          if [ "$TIME_OUTS" -gt 12 ]; then
            echo "::error::$TIME_OUTS timeouts (>2s) em 500 (2.5%+) — performance muito degradada"
            exit 1
          fi

          echo ""
          echo "=== Teste de carga SUSTENTADA 120s @ ~41 RPS (IGUAL AO BOT) ==="
          echo "Bot oficial: 5.000 requests em 120s, timeout 2.001s"
          echo "Detecta: race conditions, memory leaks, flakiness, saturation effects"
          echo "Load atual antes da carga: $(cat /proc/loadavg | awk '{print $1}')"
          > /tmp/sust_codes.txt
          END_TS=$(( $(date +%s) + 120 ))
          REQ_COUNT=0
          ERR_COUNT=0
          while [ $(date +%s) -lt $END_TS ]; do
            RESP=$(curl -s -m 2.001 -X POST http://localhost:9999/fraud-score \
              -H 'Content-Type: application/json' \
              -d '{"id":"t","transaction":{"amount":100,"installments":1,"requested_at":"2026-01-01T12:00:00Z"},"customer":{"avg_amount":100,"tx_count_24h":10,"known_merchants":[]},"merchant":{"id":"m","mcc":"5411","avg_amount":100},"terminal":{"is_online":false,"card_present":true,"km_from_home":5},"last_transaction":{"timestamp":"2025-12-31T10:00:00Z","km_from_current":5}}' \
              -o /dev/null -w "%{http_code}" 2>&1) || true
            RC=$?
            REQ_COUNT=$((REQ_COUNT + 1))
            # Timeouts (curl exit 28) aparecem como "000" no http_code
            if [ $RC -eq 28 ] || [ "${RESP:0:3}" = "000" ]; then
              ERR_COUNT=$((ERR_COUNT + 1))
            elif [ "${RESP:0:1}" = "5" ]; then
              ERR_COUNT=$((ERR_COUNT + 1))
            fi
            # Throttle to ~40 RPS
            sleep 0.024
          done
          echo "Sustained: $REQ_COUNT requests em 120s, $ERR_COUNT timeouts/erros 5xx"
          echo "Load após carga: $(cat /proc/loadavg | awk '{print $1}')"
          if [ "$ERR_COUNT" -gt "$((REQ_COUNT / 20))" ]; then
            echo "::error::$ERR_COUNT erros em $REQ_COUNT (>5%) — degradação severa"
            docker compose logs
            exit 1
          fi
          if [ "$REQ_COUNT" -lt 4500 ]; then
            echo "::warning::Só $REQ_COUNT requests em 120s (< 37 RPS, throttled — bot faria 5000)"
          fi

          echo ""
          echo "=== Re-validar detecção após carga sustentada (não regrediu?) ==="
          RESP=$(curl -s -X POST http://localhost:9999/fraud-score \
            -H 'Content-Type: application/json' \
            -d '{
              "id": "tx-1329056812",
              "transaction": {"amount": 41.12, "installments": 2, "requested_at": "2026-03-11T18:45:53Z"},
              "customer": {"avg_amount": 82.24, "tx_count_24h": 3, "known_merchants": ["MERC-003", "MERC-016"]},
              "merchant": {"id": "MERC-016", "mcc": "5411", "avg_amount": 60.25},
              "terminal": {"is_online": false, "card_present": true, "km_from_home": 29.2331036248},
              "last_transaction": null
            }')
          if echo "$RESP" | grep -q '"approved":true'; then
            echo "✓ Legit ainda aprovado após carga sustentada"
          else
            echo "::error::Legit NÃO aprovado após carga (regressão!): $RESP"
            docker compose logs
            exit 1
          fi
          RESP=$(curl -s -X POST http://localhost:9999/fraud-score \
            -H 'Content-Type: application/json' \
            -d '{
              "id": "tx-3330991687",
              "transaction": {"amount": 9505.97, "installments": 10, "requested_at": "2026-03-14T05:15:12Z"},
              "customer": {"avg_amount": 81.28, "tx_count_24h": 20, "known_merchants": ["MERC-008", "MERC-007", "MERC-005"]},
              "merchant": {"id": "MERC-068", "mcc": "7802", "avg_amount": 54.86},
              "terminal": {"is_online": false, "card_present": true, "km_from_home": 952.2745933273},
              "last_transaction": null
            }')
          if echo "$RESP" | grep -q '"approved":false'; then
            echo "✓ Fraude ainda detectada após carga sustentada"
          else
            echo "::error::Fraude NÃO detectada após carga (regressão!): $RESP"
            docker compose logs
            exit 1
          fi

          echo ""
          echo "=== Cleanup ==="
          docker compose down --remove-orphans 2>&1 || true
          
          echo "=== Parando stress de CPU ==="
          kill $STRESS_PID 2>/dev/null || true
          wait $STRESS_PID 2>/dev/null || true
          echo "Load final: $(cat /proc/loadavg | awk '{print $1}')"
          
          echo "Testes locais passaram — prosseguindo para push"

      - name: Push Docker image to GHCR
        if: success()
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/sergiotec/rinha-2026:latest
          docker push ghcr.io/sergiotec/rinha-2026:${{ github.sha }}

      - name: Verify push
        if: success()
        run: |
          echo "Verificando que a imagem foi pushada:"
          docker manifest inspect ghcr.io/sergiotec/rinha-2026:latest | head -5
          echo ""
          echo "Digest do push: ${{ github.sha }}"
