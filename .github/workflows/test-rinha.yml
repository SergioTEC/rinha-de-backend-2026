name: Simular ambiente Rinha

on:
  push:
    branches: [submission]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar stack
        run: docker compose up -d

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:9999/ready; then
              echo "PASSOU na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 3s..."
            sleep 3
          done
          echo "FALHOU health check!"
          docker compose logs
          exit 1

      - name: Testar fraud-score
        run: |
          curl -s http://localhost:9999/fraud-score -X POST -H 'Content-Type: application/json' -d '{"transaction_id":"test","user_id":"1","merchant_id":"m1","amount":100,"currency":"BRL","merchant_category":"shopping","is_online":true,"transaction_date":"2026-01-01T12:00:00Z","device_id":"d1","location":{"latitude":-23.5,"longitude":-46.6},"is_international":false,"installments":1,"user_history":{"total_transactions":50,"avg_amount":200,"std_amount":50,"fraud_reports":0,"km_from_home":5}}'

      - name: Container status
        if: always()
        run: docker ps -a

      - name: API logs
        if: always()
        run: docker compose logs api1 api2 || true

      - name: LB logs
        if: always()
        run: docker compose logs lb || true