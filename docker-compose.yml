services:
  lb:
    image: ghcr.io/sergiotec/rinha-2026:latest
    command: ["/app/lb"]
    ports:
      - "9999:9999"
    environment:
      - LB_PORT=9999
      - LB_BACKENDS=/tmp/sockets/api1.sock,/tmp/sockets/api2.sock
    networks:
      - rinha
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: '30MB'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - sockets:/tmp/sockets

  api1:
    image: ghcr.io/sergiotec/rinha-2026:latest
    command: ["/app/api"]
    environment:
      - LISTEN_SOCKET=/tmp/sockets/api1.sock
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: '0.475'
          memory: '160MB'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sockets:/tmp/sockets

  api2:
    image: ghcr.io/sergiotec/rinha-2026:latest
    command: ["/app/api"]
    environment:
      - LISTEN_SOCKET=/tmp/sockets/api2.sock
    network_mode: "none"
    deploy:
      resources:
        limits:
          cpus: '0.475'
          memory: '160MB'
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sockets:/tmp/sockets

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"

networks:
  rinha:
    driver: bridge