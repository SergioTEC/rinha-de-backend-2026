services:
  lb:
    image: ghcr.io/sergiotec/rinha-2026:latest
    platform: linux/amd64
    cpuset: "1,3"
    command: ["/app/lb"]
    ports:
      - "9999:9999"
    environment:
      - LB_PORT=9999
      - LB_BACKENDS=api1:9001,api2:9002
    networks:
      - rinha
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: '20MB'

  api1:
    image: ghcr.io/sergiotec/rinha-2026:latest
    platform: linux/amd64
    cpuset: "0"
    command: ["/app/api"]
    environment:
      - PORT=9001
    networks:
      - rinha
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.475'
          memory: '165MB'

  api2:
    image: ghcr.io/sergiotec/rinha-2026:latest
    platform: linux/amd64
    cpuset: "2"
    command: ["/app/api"]
    environment:
      - PORT=9002
    networks:
      - rinha
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.475'
          memory: '165MB'

networks:
  rinha:
    driver: bridge