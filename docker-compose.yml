services:
  api1:
    image: ghcr.io/sergiotec/rinha-2026:latest
    container_name: api1
    environment:
      - PORT=9001
      - LISTEN_SOCKET=/tmp/sockets/api1.sock
    volumes:
      - socks:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M

  api2:
    image: ghcr.io/sergiotec/rinha-2026:latest
    container_name: api2
    environment:
      - PORT=9002
      - LISTEN_SOCKET=/tmp/sockets/api2.sock
    volumes:
      - socks:/tmp/sockets
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M

  lb:
    image: ghcr.io/sergiotec/rinha-2026:latest
    container_name: lb
    entrypoint: ["/app/lb"]
    environment:
      - LB_PORT=9999
      - LB_BACKENDS=/tmp/sockets/api1.sock,/tmp/sockets/api2.sock
    ports:
      - "9999:9999"
    volumes:
      - socks:/tmp/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 20M

volumes:
  socks:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m"
