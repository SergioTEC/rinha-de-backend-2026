[package]
name = "rinha-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[dependencies]
libc = { version = "0.2", features = ["extra_traits"] }
memmap2 = "0.9"
flate2 = { version = "1.0", features = ["rust_backend"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
cc = "1.0"

[[bin]]
name = "api"
path = "src/main.rs"
